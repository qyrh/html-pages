<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML速跑 · 已发布页面</title>
<style>
body{margin:0;padding:24px 18px 60px;background:#0e1117;color:#e6edf3;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:19px;margin:0 0 4px}p.s{font-size:12.5px;color:#8b949e;margin:0 0 18px}
ul{list-style:none;padding:0;margin:0}a{display:block;padding:13px 14px;margin-bottom:9px;background:#161b22;border:1px solid #21262d;border-radius:11px;color:#4f8cff;text-decoration:none;font-size:14.5px;word-break:break-all}
a small{display:block;color:#8b949e;font-size:11.5px;margin-top:3px}
.tip{font-size:12.5px;color:#8b949e;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<h1>⚡ HTML速跑 · 已发布页面</h1>
<p class="s">本页由 App 自动发布，列出仓库里所有公开页面。</p>
<ul id="list"><li style="color:#8b949e;font-size:13px">加载中…</li></ul>
<div class="tip">打不开某个页面？GitHub Pages 刚发布要构建 30~60 秒，稍等即可；本页可随时刷新。</div>
<script>
fetch("https://api.github.com/repos/qyrh/html-pages/contents/",{cache:"no-store"}).then(function(r){return r.json()}).then(function(a){
  var ul=document.getElementById("list");
  if(!Array.isArray(a)){ul.innerHTML='<li style="color:#8b949e">列表加载失败（接口限流），刷新重试</li>';return}
  var items=a.filter(function(f){return f.type==="file"&&/\.html?$/i.test(f.name)&&f.name!=="index.html"});
  if(!items.length){ul.innerHTML='<li style="color:#8b949e">还没有已发布页面</li>';return}
  ul.innerHTML=items.map(function(f){return '<li><a href="./'+encodeURIComponent(f.name)+'">'+f.name.replace(/\.html?$/i,"")+
    '<small>'+Math.max(1,Math.round(f.size/1024))+' KB</small></a></li>'}).join("");
}).catch(function(){document.getElementById("list").innerHTML='<li style="color:#8b949e">列表加载失败，刷新重试</li>'});
</script>
</body>
</html>
